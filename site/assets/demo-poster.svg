<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title description"><title id="title">Demo preview: Sample order 03</title><desc id="description">An illustration of a paper order becoming ready and review rows. It links to the 3-minute demo video.</desc><rect width="1200" height="675" fill="#eeede7"/><g stroke="#deddd3" stroke-width="1"><path d="M0 135h1200M0 270h1200M0 405h1200M0 540h1200M240 0v675M480 0v675M720 0v675M960 0v675"/></g><g font-family="Arial, sans-serif"><text x="70" y="89" fill="#61665e" font-size="14" letter-spacing="2">PARCHIMATCH LITE / SAMPLE ORDER 03</text><rect x="70" y="140" width="480" height="340" rx="12" fill="#fff" stroke="#deddd3"/><text x="102" y="188" fill="#1d1f1c" font-size="21" font-weight="700">As written</text><g font-family="monospace" font-size="18" fill="#61665e"><text x="102" y="247">Namaste bhaiya</text><text x="102" y="299">kit kat 10/- darjan 4</text><text x="102" y="351">marie 30 wala 20 jodi</text><text x="102" y="403">12 pack lais peela 10 wala</text></g><text x="580" y="324" fill="#61665e" font-size="35">→</text><rect x="650" y="140" width="480" height="340" rx="12" fill="#fff" stroke="#deddd3"/><text x="682" y="188" fill="#1d1f1c" font-size="21" font-weight="700">Checked rows</text><rect x="672" y="213" width="436" height="58" rx="5" fill="#eeede7"/><text x="690" y="250" fill="#61665e" font-size="18">Note · ignored</text><rect x="672" y="283" width="436" height="58" rx="5" fill="#edf6f0"/><text x="690" y="320" fill="#2f7d4f" font-size="18">Ready · 4 dozen · 48 pieces</text><rect x="672" y="353" width="436" height="58" rx="5" fill="#fff6e6"/><text x="690" y="390" fill="#a35f00" font-size="18">Needs you · what is “jodi”?</text><text x="682" y="451" fill="#61665e" font-size="13">Illustration using synthetic demo data</text><text x="70" y="560" fill="#1d1f1c" font-size="27" font-weight="700">Paste. Check. Export.</text><text x="70" y="602" fill="#61665e" font-size="17">Watch the 3-minute demo on YouTube ↗</text></g></svg>
