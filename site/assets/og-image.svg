<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description"><title id="title">ParchiMatch Lite</title><desc id="description">Messy orders become clear billing rows. An illustrated paper slip shows ready, needs-review and note states.</desc><rect width="1200" height="630" fill="#f6f4ef"/><g font-family="Arial, sans-serif"><g transform="translate(64 59)"><rect width="34" height="40" rx="5" fill="#1f6f5c"/><path d="M10 8h10l5 5v19H10zM19 8v6h6M14 19h7M14 24h7" fill="none" stroke="#fff" stroke-width="1.5"/><text x="48" y="28" font-size="25" font-weight="700" fill="#1d1f1c">ParchiMatch Lite</text></g><text x="64" y="199" fill="#61665e" font-size="13" letter-spacing="2">A PARCHI BECOMES A LEDGER</text><text x="64" y="278" fill="#1d1f1c" font-size="62" font-weight="700" letter-spacing="-2">Messy orders.</text><text x="64" y="352" fill="#1f6f5c" font-size="62" font-weight="700" letter-spacing="-2">Clear billing rows.</text><text x="64" y="409" fill="#61665e" font-size="21">Runs locally. Asks when unsure.</text><text x="64" y="554" fill="#61665e" font-size="15">Open source · MIT · Offline order matching</text><g transform="translate(655 134)"><rect x="9" y="9" width="475" height="363" rx="12" fill="#eeede7" stroke="#deddd3"/><rect width="475" height="363" rx="12" fill="#fff" stroke="#deddd3"/><text x="25" y="40" fill="#1d1f1c" font-size="17" font-weight="700">A parchi, checked.</text><text x="25" y="66" fill="#61665e" font-size="11">HTML DEMONSTRATION · SYNTHETIC CATALOGUE</text><path d="M0 87h475" stroke="#deddd3"/><rect y="88" width="475" height="81" fill="#edf6f0"/><rect y="88" width="4" height="81" fill="#2f7d4f"/><text x="24" y="117" fill="#1d1f1c" font-family="monospace" font-size="14">kit kat 10/- darjan 4</text><text x="24" y="147" fill="#2f7d4f" font-size="14" font-weight="700">Ready · 4 dozen · 48 pieces</text><rect y="169" width="475" height="95" fill="#fff6e6"/><rect y="169" width="4" height="95" fill="#a35f00"/><text x="24" y="200" fill="#1d1f1c" font-family="monospace" font-size="14">marie 30 wala 20 jodi</text><text x="24" y="232" fill="#a35f00" font-size="14" font-weight="700">What is “jodi”? packet or carton?</text><rect y="264" width="475" height="68" fill="#eeede7"/><text x="24" y="293" fill="#61665e" font-family="monospace" font-size="14">Namaste bhaiya</text><text x="24" y="317" fill="#61665e" font-size="12">Note · ignored</text><text x="24" y="352" fill="#61665e" font-size="10">Product names are examples; no affiliation.</text></g></g></svg>
